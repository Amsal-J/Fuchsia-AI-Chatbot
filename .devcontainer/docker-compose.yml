services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    env_file: ../.env
    ports:
      - "5432:5432" #Postgres Database
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # Temporal Server
      - "8233:8233" # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  dev:
    image: mcr.microsoft.com/devcontainers/java:21-bookworm
    volumes:
      - ..:/workspaces/fuchsia-ai-chatbot:cached
    env_file: ../.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DB_HOST: postgres
    command: sleep infinity
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata: