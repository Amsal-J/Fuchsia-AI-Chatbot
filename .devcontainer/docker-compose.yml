services:
  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # Temporal Server
      - "8233:8233" # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  dev:
    image: mcr.microsoft.com/devcontainers/java:21-bookworm
    volumes:
      - ..:/workspaces/fuchsia-ai-chatbot:cached
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    command: sleep infinity
    depends_on:
      temporal:
        condition: service_healthy