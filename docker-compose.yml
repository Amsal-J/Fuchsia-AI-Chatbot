services:
  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # Temporal server
      - "8233:8233"   # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    env_file: .env
    ports:
      - "5432:5432" #Postgres Database
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    image: fuchsia-ai-chatbot:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./folder1:/app/folder1
      - ./folder2:/app/folder2
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

  starter:
    build: .
    image: fuchsia-ai-chatbot:latest
    command: ["fuchsia.IngestionStarter"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  grpc-server:
    build: .
    image: fuchsia-ai-chatbot:latest
    command: ["fuchsia.FileIngestionServer"]
    ports:
      - "50051:50051"
    volumes:
      - ./folder1:/app/folder1
    restart: unless-stopped

  web:
    build: .
    image: fuchsia-ai-chatbot:latest
    command: ["fuchsia.WebServer"]
    environment:
      GRPC_HOST: grpc-server
      WEB_BIND: 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      - grpc-server
    restart: unless-stopped

  client:
    build: .
    image: fuchsia-ai-chatbot:latest
    profiles: ["tools"]
    entrypoint: ["java", "-cp", "app.jar:lib/*", "fuchsia.FileIngestionClient"]
    environment:
      GRPC_HOST: grpc-server
    volumes:
      - ./outbox:/outbox
    depends_on:
      - grpc-server

volumes:
  pgdata: